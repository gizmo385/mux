[package]
name = "agent-mux"
version = "0.1.0"
edition = "2024"
description = "A fast, terminal-first multiplexer for managing multiple Claude Code conversations across local and remote hosts."
license = "MIT"
authors = ["gizmo385"]

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
notify = "8.2.0"
ratatui = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3.27.0"
