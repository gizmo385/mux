name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt: musl-tools
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install apt deps
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/agent-mux" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -C "$stage" -czf "agent-mux-${{ matrix.target }}.tar.gz" .
          shasum -a 256 "agent-mux-${{ matrix.target }}.tar.gz" > "agent-mux-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: agent-mux-${{ matrix.target }}
          path: |
            agent-mux-${{ matrix.target }}.tar.gz
            agent-mux-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  publish-latest:
    name: publish "latest" release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Refresh "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          notes="Built from \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          This release tracks \`main\` and is replaced on every push. Pin a tagged release for stability."
          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest main build" \
            --notes "$notes" \
            --prerelease
